name: Audit arXiv consistency

on:
  push:
    branches: [audit/arxiv-consistency]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare catalog with arXiv metadata
        run: |
          python - <<'PY'
          import csv, re, time, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path

          rows = list(csv.DictReader(Path('data/resources.csv').open(encoding='utf-8', newline='')))
          by_id = {}
          for row in rows:
              if row['section'] != 'Papers':
                  continue
              m = re.match(r'https?://arxiv\.org/abs/([^?#]+)', row['url'])
              if m:
                  by_id[m.group(1).split('v')[0]] = row

          ns = {'a':'http://www.w3.org/2005/Atom', 'x':'http://arxiv.org/schemas/atom'}
          patterns = re.compile(r'accepted|to appear|conference|published|proceedings|findings|cvpr|iccv|eccv|iclr|aaai|neurips|emnlp|acl|acm|ijcai|cikm|bmvc|wacv', re.I)
          print('ARXIV_MISMATCH_BEGIN')
          ids = list(by_id)
          for i in range(0, len(ids), 20):
              chunk = ids[i:i+20]
              q = urllib.parse.urlencode({'id_list': ','.join(chunk), 'max_results': len(chunk)})
              req = urllib.request.Request('https://export.arxiv.org/api/query?' + q, headers={'User-Agent':'awesome-creative-graphic-design-generation/1.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  root = ET.parse(r).getroot()
              for e in root.findall('a:entry', ns):
                  aid = e.findtext('a:id','',ns).rsplit('/',1)[-1].split('v')[0]
                  row = by_id.get(aid)
                  if not row:
                      continue
                  published = e.findtext('a:published','',ns)[:10]
                  updated = e.findtext('a:updated','',ns)[:10]
                  journal = (e.findtext('x:journal_ref','',ns) or '').replace('\t',' ').replace('\n',' ')
                  comment = (e.findtext('x:comment','',ns) or '').replace('\t',' ').replace('\n',' ')
                  title = ' '.join(e.findtext('a:title','',ns).split())
                  flags = []
                  if row['arxiv_date'] and row['arxiv_date'] != published:
                      flags.append(f'DATE catalog={row["arxiv_date"]} arxiv={published}')
                  if not row['arxiv_date']:
                      flags.append(f'MISSING_DATE arxiv={published}')
                  if row['venue'] == 'arXiv' and (journal or patterns.search(comment)):
                      flags.append('ARXIV_ONLY_WITH_PUBLICATION_HINT')
                  if flags:
                      print('\t'.join(['ROW', aid, row['name'], row['venue'], row['venue_year'], published, updated, journal, comment, title, ' | '.join(flags)]))
              time.sleep(3.2)
          print('ARXIV_MISMATCH_END')
          PY
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-arxiv-consistency.yml
          git commit -m 'Remove temporary arXiv consistency workflow'
          git push
