name: Update CAL-RAG GENNEXT metadata

on:
  push:
    branches:
      - metadata/cal-rag-gennext-2025

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: metadata/cal-rag-gennext-2025
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Update metadata and regenerate README
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('data/resources.csv')
          text = path.read_text()
          old = 'Papers,Content-Aware Layout Generation,CAL-RAG,https://arxiv.org/abs/2506.21934,"Combines multimodal retrieval, an LLM layout recommender, a vision-language grader, and feedback agents for iterative content-aware layout generation.",Agentic; LLM; VLM,arXiv,2025,2025-06-27,,arXiv v1'
          new = 'Papers,Content-Aware Layout Generation,CAL-RAG,https://sigirgennext.github.io/GENNEXT-SIGIR-25/submissions/gennext_sigir25_5.pdf,"Combines multimodal retrieval, an LLM layout recommender, a vision-language grader, and feedback agents for iterative content-aware layout generation (SIGIR GENNEXT 2025).",Agentic; LLM; VLM,SIGIR Workshop (GENNEXT),2025,2025-06-27,2025-07-17,arXiv v1 precedes GENNEXT@SIGIR 2025 workshop'
          if text.count(old) != 1:
              raise SystemExit(f'expected one CAL-RAG row, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          uv run python scripts/generate_readme.py
          git rm .github/workflows/update-cal-rag-gennext.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resources.csv README.md
          git commit -m 'Record CAL-RAG as a SIGIR GENNEXT 2025 paper'
          git push
