name: Update LaDe CVPRW metadata

on:
  push:
    branches:
      - metadata/lade-cvprw-2026

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: metadata/lade-cvprw-2026
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Update metadata and regenerate README
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('data/resources.csv')
          text = path.read_text()
          old = 'Papers,Composable and Layered Asset Generation,LaDe: Unified Multi-Layered Graphic Media Generation and Decomposition,https://arxiv.org/abs/2603.17965,"Jointly generates full graphic-media designs and a flexible number of semantically meaningful RGBA layers, while also supporting image-to-layers decomposition with a latent diffusion transformer and RGBA VAE.",Diffusion; Transformer; LLM; VAE,arXiv,2026,2026-03-18,,arXiv v1'
          new = 'Papers,Composable and Layered Asset Generation,LaDe: Unified Multi-Layered Graphic Media Generation and Decomposition,https://openaccess.thecvf.com/content/CVPR2026W/CVEU/html/Lungu-Stan_LaDe_Unified_Multi-Layered_Graphic_Media_Generation_and_Decomposition_CVPRW_2026_paper.html,"Jointly generates full graphic-media designs and a flexible number of semantically meaningful RGBA layers, while also supporting image-to-layers decomposition with a latent diffusion transformer and RGBA VAE (CVPRW 2026).",Diffusion; Transformer; LLM; VAE,CVPR Workshop (CVEU),2026,2026-03-18,2026-06-03,arXiv v1 precedes CVEU workshop at CVPR 2026'
          if text.count(old) != 1:
              raise SystemExit(f'expected one LaDe row, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          uv run python scripts/generate_readme.py
          git rm .github/workflows/update-lade-cvprw.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resources.csv README.md
          git commit -m 'Record LaDe as a CVPRW 2026 paper'
          git push
