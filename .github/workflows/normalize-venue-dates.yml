name: Normalize venue dates

on:
  push:
    branches:
      - data/normalize-venue-dates

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: data/normalize-venue-dates
      - uses: astral-sh/setup-uv@v6
      - name: Normalize verified conference dates
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("data/resources.csv")
          text = path.read_text(encoding="utf-8")
          replacements = {
              ",AAAI,2023,,2023-02-09,AAAI-23 poster session": ",AAAI,2023,,2023-02-07,AAAI-23 conference start",
              ",CVPR,2024,,2024-06-19,CVPR 2024 presentation/publication": ",CVPR,2024,,2024-06-17,CVPR 2024 conference start",
              ",ICASSP,2022,2023-01-06,2022-05-23,venue precedes arXiv; ICASSP conference presentation": ",ICASSP,2022,2023-01-06,2022-05-22,venue precedes arXiv; ICASSP 2022 conference start",
              ",CHI,2023,,2023-04-26,CHI 2023 Creativity Support session": ",CHI,2023,,2023-04-23,CHI 2023 conference start",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match for {old!r}, found {count}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          uv sync
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
      - name: Remove one-off helper and commit result
        run: |
          rm .github/workflows/normalize-venue-dates.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/resources.csv README.md .github/workflows/normalize-venue-dates.yml
          git diff --cached --check
          git commit -m "Normalize verified conference venue dates"
          git push origin HEAD:data/normalize-venue-dates
