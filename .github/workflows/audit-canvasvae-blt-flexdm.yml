name: Audit CanvasVAE BLT FlexDM

on:
  push:
    branches:
      - metadata/canvasvae-blt-flexdm
    paths:
      - .github/workflows/audit-canvasvae-blt-flexdm.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: metadata/canvasvae-blt-flexdm
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Add audited metadata
        run: |
          git fetch origin main
          git show origin/main:data/paper_metadata.csv > data/paper_metadata.csv
          cat >> data/paper_metadata.csv <<'EOF'
          CanvasVAE,,https://github.com/CyberAgentAILab/canvas-vae,,train+inference,unknown,Variational generative modeling of vector graphic documents,CanvasVAE with learned PixelVAE image embeddings,"Crello; RICO","Crello; RICO",Vector-graphic document structure and element attributes,"Official repository provides preprocessing, PixelVAE/CanvasVAE training, evaluation, and analysis notebooks. No canonical released pretrained CanvasVAE checkpoint was verified.",2026-10-07
          Layout-BLT,https://shawnkx.github.io/blt,https://github.com/google-research/google-research/tree/master/layout-blt,,train+inference,unknown,Bidirectional non-autoregressive layout transformer,Bidirectional Transformer,"COCO; RICO; PubLayNet; Magazine","COCO; RICO; PubLayNet; Magazine",Structured layout boxes,"Google Research repository provides training/testing code. Its README has a pretrained-model section for RICO and PubLayNet but the download links are empty, so weights are not marked released.",2026-10-07
          FlexDM,https://cyberagentailab.github.io/flex-dm/,https://github.com/CyberAgentAILab/flex-dm,https://storage.googleapis.com/ailab-public/flexdm/pretrained_weights/crello.zip,train+inference,released,Masked multi-modal field prediction for flexible vector-graphic design tasks,Encoder-decoder with multimodal field heads,"Crello; RICO","Crello; RICO",Vector-graphic document fields and layouts,"Official repository provides demos, training, quantitative evaluation, preprocessed Crello/RICO data, and released pretrained checkpoints for both datasets. The weights URL points to the Crello checkpoint archive; the README also links the RICO archive.",2026-10-07
          EOF
          uv run python scripts/generate_readme.py
          git rm .github/workflows/audit-canvasvae-blt-flexdm.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/paper_metadata.csv README.md
          git commit -m 'Audit CanvasVAE BLT and FlexDM reproducibility metadata'
          git push origin HEAD:metadata/canvasvae-blt-flexdm
