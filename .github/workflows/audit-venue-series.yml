name: Audit venue series and stable URLs
on:
  push:
    branches: [venues/recurrence-stable-urls]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Normalize venue series metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('data/venues.csv')
          s = p.read_text()
          replacements = {
              'Conference,ICASSP,https://2026.ieeeicassp.org/,Signal processing and multimedia; includes poster and text-layout generation work.':
                  'Conference,ICASSP,https://signalprocessingsociety.org/event-names/icassp,Signal processing and multimedia; annual IEEE Signal Processing Society flagship series that includes poster and text-layout generation work.',
              'Conference,ICME,https://www.2026.ieeeicme.org/,Multimedia; relevant for multimodal content generation and visual-design systems.':
                  'Conference,ICME,https://ieee-cas.org/media-bookdirectory/icme,Multimedia; recurring IEEE flagship series since 2000 and relevant for multimodal content generation and visual-design systems.',
              'Conference,BMVC,https://bmvc2026.org/,Computer vision; includes scientific-poster layout datasets and document-layout research.':
                  'Conference,BMVC,https://www.bmva.org/bmvc,Computer vision; annual BMVA conference with an official proceedings archive and relevant scientific-poster/document-layout research.',
              'Conference,Pacific Graphics,https://pg2025.nccu.edu.tw/,"Computer graphics; includes optimization, authoring, and graphic-layout research."':
                  'Conference,Pacific Graphics,https://asiagraphics.org/,"Annual flagship conference of the Asia Graphics Association; includes optimization, authoring, and graphic-layout research."',
              'Workshop,Graphic Design Understanding and Generation (GDUG),https://sites.google.com/view/gdug-workshop,"Dedicated graphic-design workshop series; held at CVPR 2024 and ICCV 2025 with topics spanning layout, typography, datasets, evaluation, and AI-assisted authoring."':
                  'Workshop,Graphic Design Understanding and Generation (GDUG),https://sites.google.com/view/gdug-workshop,"Recurring dedicated graphic-design workshop; CVF proceedings verify editions at CVPR 2024 and ICCV 2025 spanning layout, typography, datasets, evaluation, and AI-assisted authoring."',
              'Workshop,Human-Interactive Generation and Editing (HiGen),https://higen-2025.github.io/,"Human-interactive visual generation and editing workshop; first held at ICCV 2025 and second at CVPR 2026, including multimodal control and sketch-guided design generation."':
                  'Workshop,Human-Interactive Generation and Editing (HiGen),https://higen-2025.github.io/,"Recurring human-interactive generation/editing workshop; ICCV 2025 was the first edition and CVPR 2026 explicitly hosted the 2nd workshop, including multimodal control and sketch-guided design generation."',
              'Workshop,AI for Content Creation (AI4CC),https://ai-for-content-creation.github.io/,"Recurring CVPR workshop on AI-assisted content creation across art, design, documents, advertising, photography, video, and related media."':
                  'Workshop,AI for Content Creation (AI4CC),https://ai-for-content-creation.github.io/,"Recurring CVPR workshop series; the official archive lists annual editions from 2020 through 2025 and CVPR 2026 hosted another edition, covering art, design, documents, advertising, photography, video, and related media."',
              'Workshop,"AI for Creative Visual Content Generation, Editing and Understanding (CVEU)",https://openaccess.thecvf.com/CVPR2025_workshops/CVEU,"Workshop series on generative and editing technologies for creative visual content, with editions across CVPR, ICCV, ECCV, and SIGGRAPH-related venues."':
                  'Workshop,"AI for Creative Visual Content Generation, Editing and Understanding (CVEU)",https://cveu.github.io/,"Long-running creative-visual-content workshop series with verified editions across ICCV, ECCV, CVPR, SIGGRAPH, and SIGGRAPH Asia; the official series site tracks the continuing edition history."',
          }
          for old, new in replacements.items():
              assert old in s, old
              s = s.replace(old, new)
          p.write_text(s)

          d = Path('data/README.md')
          ds = d.read_text()
          old = '`venues.csv` — recurring conferences, journals, and workshops monitored for relevant work.'
          new = '`venues.csv` — recurring conferences, journals, and workshop series monitored for relevant work. It intentionally keeps one row per stable series; use an authoritative series/archive URL when one exists, and record concise edition/recurrence evidence in `note`. Add a separate edition table only if concrete query/rendering needs justify the one-to-many model rather than for audit bookkeeping.'
          assert old in ds
          d.write_text(ds.replace(old, new))
          PY
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/venues.csv data/README.md README.md
          git commit -m 'Normalize recurring venue series metadata'
          git push
