name: Paper Figure Preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'paper/figs/**'
      - 'paper/scripts/prepare_affiliation_logos.sh'
      - 'paper/scripts/build_figures.sh'
      - '.github/workflows/paper-figure-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-figure-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-figures:
    name: Verify and preview editable vector map
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout figure sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Preserve only verified upstream masters between workflows. Their
      # complete SHA-1 values are rechecked inside the figure build itself.
      - name: Restore source-pinned institution logo masters
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            paper/figs/assets/logos/bit-original.ai
            paper/figs/assets/logos/salesforce-official.zip
            paper/figs/assets/logos/meituan-official.zip
          key: institution-master-assets-v1-bit6fcb6505-salesforceb8cca7fa-meituan6817f88d
      - name: Enforce institutional logo and figure rules
        run: |
          sh -n paper/scripts/prepare_affiliation_logos.sh
          python3 paper/scripts/check_manuscript.py
      - name: Build standalone figures only
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: figs/tex/research_map_narrative.tex
          working_directory: paper
          extra_system_packages: 'rsvg-convert curl python3 unzip'
          pre_compile: |
            sh scripts/build_figures.sh
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Confirm square logos and vector research map
        shell: bash
        run: |
          set -euo pipefail
          test -s paper/figs/assets/logos/cyberagent-symbol.pdf
          test -s paper/figs/assets/logos/pku.pdf
          test -s paper/figs/assets/logos/google.pdf
          test -s paper/figs/assets/logos/microsoft.pdf
          test -s paper/figs/assets/logos/bit-symbol.pdf
          test -s paper/figs/assets/logos/salesforce.pdf
          test -s paper/figs/assets/logos/meituan-symbol.pdf
          test -s paper/figs/pdf/research_map_narrative.pdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdfinfo paper/figs/assets/logos/cyberagent-symbol.pdf | tee paper/ca-symbol-info.txt
          pdfinfo paper/figs/assets/logos/pku.pdf | tee paper/pku-info.txt
          pdfinfo paper/figs/assets/logos/google.pdf | tee paper/google-info.txt
          pdfinfo paper/figs/assets/logos/microsoft.pdf | tee paper/microsoft-info.txt
          pdfinfo paper/figs/assets/logos/bit-symbol.pdf | tee paper/bit-symbol-info.txt
          pdfinfo paper/figs/assets/logos/salesforce.pdf | tee paper/salesforce-info.txt
          pdfinfo paper/figs/assets/logos/meituan-symbol.pdf | tee paper/meituan-symbol-info.txt
          pdfinfo paper/figs/pdf/research_map_narrative.pdf | tee paper/map-info.txt
          grep -Eq 'Page size:[[:space:]]+57 x 57 pts' paper/ca-symbol-info.txt
          grep -Eq 'Page size:[[:space:]]+307 x 307 pts' paper/bit-symbol-info.txt
          pdftotext paper/figs/pdf/research_map_narrative.pdf paper/map-text.txt
          grep -Fq 'OpenCOLE' paper/map-text.txt
          grep -Fq 'COLE' paper/map-text.txt
          if grep -Fq 'Affiliation provenance' paper/map-text.txt; then
            echo 'Detached affiliation footer remains in research map' >&2
            exit 1
          fi
          if pdfimages -list paper/figs/pdf/research_map_narrative.pdf | tail -n +3 | grep -q .; then
            echo 'Research map must remain vector-only (no raster logos)' >&2
            exit 1
          fi
          pdftoppm -f 1 -l 1 -singlefile -r 180 -png paper/figs/pdf/research_map_narrative.pdf paper/research-map-preview
          pdftoppm -f 1 -l 1 -singlefile -r 350 -png paper/figs/assets/logos/cyberagent-symbol.pdf paper/ca-square-preview
          pdftoppm -f 1 -l 1 -singlefile -r 150 -png paper/figs/assets/logos/bit-symbol.pdf paper/bit-square-preview
          pdftoppm -f 1 -l 1 -singlefile -r 350 -png paper/figs/assets/logos/salesforce.pdf paper/salesforce-square-preview
          # Avoid a silent color regression: the STRUCTURE lane used to
          # render with a black accent even though its defined color is green.
          pdftoppm -f 1 -l 1 -singlefile -r 180 paper/figs/pdf/research_map_narrative.pdf paper/map-color-audit
          python3 - <<'PY'
          from pathlib import Path
          data = Path("paper/map-color-audit.ppm").read_bytes()
          magic, dimensions, depth, pixels = data.split(b"\n", 3)
          assert magic == b"P6" and depth == b"255", "Expected 24-bit RGB PPM"
          width, height = map(int, dimensions.split())
          x, y = round(width * .025), round(height * .49)
          offset = (y * width + x) * 3
          rgb = tuple(pixels[offset:offset + 3])
          assert rgb[1] > rgb[0] + 35 and rgb[1] > rgb[2] + 10, (
              f"STRUCTURE lane accent should be green, got RGB={rgb}")
          print(f"PASS: STRUCTURE lane accent remains green (RGB={rgb})")
          PY
          test -s paper/research-map-preview.png
          test -s paper/ca-square-preview.png
          # The original company wordmark begins to the right of its CA glyph.
          # Fail if any black wordmark pixels leak into the square symbol tile.
          pdftoppm -f 1 -l 1 -singlefile -r 120 paper/figs/assets/logos/cyberagent-symbol.pdf paper/ca-square-audit
          python3 - <<'PY'
          from pathlib import Path
          data = Path("paper/ca-square-audit.ppm").read_bytes()
          assert data.startswith(b"P6\n"), "Expected binary RGB PPM"
          parts = data.split(b"\n", 3)
          assert len(parts) == 4 and parts[2] == b"255", "Unexpected PPM header"
          rgb = parts[3]
          assert len(rgb) % 3 == 0, "Unexpected RGB payload"
          black = sum(1 for i in range(0, len(rgb), 3) if max(rgb[i:i+3]) < 90)
          assert black == 0, f"CA symbol crop still includes {black} black wordmark pixels"
          print("PASS: compact CA logo has no black wordmark text pixels")
          PY
      - name: Upload figure PDFs and proof PNGs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-map-proof-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            paper/figs/pdf/research_map_narrative.pdf
            paper/figs/assets/logos/cyberagent-symbol.pdf
            paper/figs/assets/logos/pku.pdf
            paper/figs/assets/logos/google.pdf
            paper/figs/assets/logos/microsoft.pdf
            paper/figs/assets/logos/bit-symbol.pdf
            paper/figs/assets/logos/salesforce.pdf
            paper/figs/assets/logos/meituan-symbol.pdf
            paper/research-map-preview.png
            paper/ca-square-preview.png
            paper/map-info.txt
            paper/ca-symbol-info.txt
            paper/pku-info.txt
            paper/google-info.txt
            paper/microsoft-info.txt
            paper/bit-symbol-info.txt
            paper/salesforce-info.txt
            paper/meituan-symbol-info.txt
            paper/salesforce-square-preview.png
            paper/bit-square-preview.png
