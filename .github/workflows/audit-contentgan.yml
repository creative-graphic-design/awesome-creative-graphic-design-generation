name: Audit ContentGAN reproducibility

on:
  push:
    branches:
      - metadata/contentgan
    paths:
      - .github/workflows/audit-contentgan.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: metadata/contentgan
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Add audited metadata
        run: |
          git fetch origin main
          git show origin/main:data/paper_metadata.csv > data/paper_metadata.csv
          cat >> data/paper_metadata.csv <<'EOF'
          ContentGAN,https://xtqiao.com/projects/content_aware_layout/,https://portland-my.sharepoint.com/:f:/g/personal/xqiao6-c_my_cityu_edu_hk/EoOt-X32-BlNmdpTPlhNVvEBxEBEHFfTwL1RHWAE_Em-0A?e=U1FYRa,,unknown,unknown,Content-aware deep generative modeling of graphic-design layouts,,Magazine,Magazine,Structured content-aware graphic-design layouts,"The authors' official project page still exposes Code and Dataset download links, but the legacy SharePoint code archive could not be reliably fetched during this audit, so runnable-code and checkpoint status are not inferred from the paper or link label alone.",2026-10-07
          EOF
          uv run python scripts/generate_readme.py
          git rm .github/workflows/audit-contentgan.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/paper_metadata.csv README.md
          git commit -m 'Audit ContentGAN reproducibility metadata'
          git push origin HEAD:metadata/contentgan
