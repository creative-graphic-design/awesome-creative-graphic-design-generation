name: Audit ArcDeck and SciFig reproducibility metadata
on:
  push:
    branches: [metadata/arcdeck-scifig]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Add audited metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import io

          p = Path('data/paper_metadata.csv')
          raw = p.read_bytes()
          text = raw.decode('utf-8')
          names = {row['name'] for row in csv.DictReader(io.StringIO(text))}
          rows = [
              [
                  'ArcDeck',
                  'https://arcdeck.org/',
                  'https://github.com/RehgLab/ArcDeck',
                  '',
                  'pipeline',
                  'not-applicable',
                  'Narrative-driven multi-agent paper-to-slide generation',
                  'Configurable GPT/Claude/Qwen/vLLM language models; python-pptx/PptxGenJS rendering',
                  'None',
                  'ArcBench',
                  'Editable PPTX; slide-planning JSON intermediates',
                  'Official repository provides a runnable CLI, web UI, Claude Skill, and released ArcBench dataset. The workflow uses configurable foundation models and releases no task-specific trained checkpoint.',
                  '2026-10-07',
              ],
              [
                  'SciFig',
                  'https://shramanpramanick.github.io/SciFig/',
                  '',
                  '',
                  'announced',
                  'unknown',
                  'Multi-agent editable scientific-figure generation',
                  '',
                  'None',
                  'SciFig-Bench (announced)',
                  'Editable XML',
                  'Official project page currently marks both Code and SciFig-Bench as Coming Soon. No public implementation or task-specific checkpoint was verified; the benchmark is described as 435 human-verified figures across 37 arXiv domains and 15 venues.',
                  '2026-10-07',
              ],
          ]
          line_ending = '\r\n' if b'\r\n' in raw else '\n'
          out = io.StringIO(newline='')
          writer = csv.writer(out, lineterminator=line_ending)
          added = 0
          for row in rows:
              if row[0] not in names:
                  writer.writerow(row)
                  added += 1
          assert added == 2, f'expected 2 new metadata rows, got {added}'
          prefix = b'' if raw.endswith((b'\n', b'\r')) else line_ending.encode()
          p.write_bytes(raw + prefix + out.getvalue().encode('utf-8'))
          PY
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/paper_metadata.csv README.md
          git commit -m 'Audit ArcDeck and SciFig reproducibility metadata'
          git push
