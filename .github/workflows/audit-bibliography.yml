name: Audit bibliography

on:
  push:
    branches: [audit/venue-metadata-scan]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Crossref audit
        run: |
          python - <<'PY'
          import csv, json, re, time, urllib.parse, urllib.request
          from difflib import SequenceMatcher
          from pathlib import Path

          def norm(s):
              s = s.lower()
              s = re.sub(r'[^a-z0-9]+', ' ', s)
              return ' '.join(s.split())

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'awesome-creative-graphic-design-generation audit/1.0'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          rows = list(csv.DictReader(Path('data/resources.csv').open(encoding='utf-8', newline='')))
          print('AUDIT_BEGIN')
          for row in rows:
              if row['section'] != 'Papers':
                  continue
              name = row['name']
              current_venue = row['venue']
              current_year = row['venue_year']
              try:
                  if row['url'].startswith('https://doi.org/'):
                      doi = row['url'].removeprefix('https://doi.org/')
                      msg = get_json('https://api.crossref.org/works/' + urllib.parse.quote(doi, safe=''))['message']
                      title = (msg.get('title') or [''])[0]
                      container = (msg.get('container-title') or [''])[0]
                      parts = (msg.get('published-online') or msg.get('published-print') or msg.get('published') or msg.get('issued') or {}).get('date-parts', [[None]])
                      year = str(parts[0][0] or '')
                      score = SequenceMatcher(None, norm(name), norm(title)).ratio()
                      print(f'EXACT_DOI\t{name}\t{current_venue}\t{current_year}\t{title}\t{container}\t{year}\t{doi}\t{score:.3f}')
                  else:
                      q = urllib.parse.urlencode({'query.title': name, 'rows': 3, 'select': 'DOI,title,container-title,published,issued,type'})
                      items = get_json('https://api.crossref.org/works?' + q)['message']['items']
                      best = None
                      for msg in items:
                          title = (msg.get('title') or [''])[0]
                          score = SequenceMatcher(None, norm(name), norm(title)).ratio()
                          if best is None or score > best[0]:
                              best = (score, msg, title)
                      if best and best[0] >= 0.86:
                          score, msg, title = best
                          container = (msg.get('container-title') or [''])[0]
                          parts = (msg.get('published') or msg.get('issued') or {}).get('date-parts', [[None]])
                          year = str(parts[0][0] or '')
                          doi = msg.get('DOI', '')
                          print(f'TITLE_MATCH\t{name}\t{current_venue}\t{current_year}\t{title}\t{container}\t{year}\t{doi}\t{score:.3f}')
              except Exception as e:
                  print(f'ERROR\t{name}\t{type(e).__name__}\t{e}')
              time.sleep(0.15)
          print('AUDIT_END')
          PY
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-bibliography.yml
          git commit -m 'Remove temporary bibliography audit workflow'
          git push
