name: Migrate Bibliographic Links

on:
  push:
    branches:
      - issue-125-provider-icons
    paths:
      - scripts/migrate_bibliographic_links.py
      - .github/workflows/migrate-bibliographic-links.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: issue-125-provider-icons

      - name: Limit fallback concurrency
        run: sed -i 's/MAX_WORKERS = 6/MAX_WORKERS = 1/' scripts/migrate_bibliographic_links.py

      - name: Run bibliographic migration
        run: python scripts/migrate_bibliographic_links.py

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync generator environment
        run: uv sync

      - name: Validate canonical resource contract
        run: uv run python scripts/validate_resource_contract.py

      - name: Regenerate README
        run: uv run python scripts/generate_readme.py

      - name: Commit migrated resources and README
        run: |
          if git diff --quiet -- data/resources.csv README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resources.csv README.md
          git commit -m "Separate publication and arXiv links"
          git push origin HEAD:issue-125-provider-icons
