name: Audit COLE and OpenCOLE reproducibility metadata
on:
  push:
    branches: [metadata/cole-opencole]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Add audited metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import io

          p = Path('data/paper_metadata.csv')
          raw = p.read_bytes()
          names = {row['name'] for row in csv.DictReader(io.StringIO(raw.decode('utf-8')))}
          rows = [
              [
                  'COLE',
                  'https://graphic-design-generation.github.io/',
                  '',
                  '',
                  'announced',
                  'unknown',
                  'Hierarchical multi-model editable graphic-design generation',
                  'Fine-tuned LLMs; large multimodal models; diffusion models',
                  'Proprietary design data (not publicly released)',
                  'DESIGNINTENTION benchmark',
                  'Multi-layer editable graphic design',
                  'Official project source still states that code will be released; no public runnable implementation or canonical task-specific checkpoint was verified. Benchmark/data assets are linked from the project page.',
                  '2026-10-07',
              ],
              [
                  'OpenCOLE',
                  '',
                  'https://github.com/CyberAgentAILab/OpenCOLE',
                  'https://huggingface.co/cyberagent/opencole-stable-diffusion-xl-base-1.0-finetune',
                  'train+inference',
                  'released',
                  'Open reproducible hierarchical graphic-design generation pipeline',
                  'K-shot LLM; SDXL fine-tune; LLaVA-v1.5-7B typography LoRA; renderer',
                  'OpenCOLE dataset v1',
                  'GPT-4V-based generated-design evaluation',
                  'Rendered graphic design',
                  'Official repository provides training, inference, evaluation, the OpenCOLE dataset, and released SDXL and TypographyLMM weights. The repository was archived read-only on 2026-07-04 but remains publicly reproducible.',
                  '2026-10-07',
              ],
          ]
          line_ending = '\r\n' if b'\r\n' in raw else '\n'
          out = io.StringIO(newline='')
          writer = csv.writer(out, lineterminator=line_ending)
          added = 0
          for row in rows:
              if row[0] not in names:
                  writer.writerow(row)
                  added += 1
          assert added == 2, f'expected 2 new metadata rows, got {added}'
          prefix = b'' if raw.endswith((b'\n', b'\r')) else line_ending.encode()
          p.write_bytes(raw + prefix + out.getvalue().encode('utf-8'))
          PY
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/paper_metadata.csv README.md
          git commit -m 'Audit COLE and OpenCOLE reproducibility metadata'
          git push
