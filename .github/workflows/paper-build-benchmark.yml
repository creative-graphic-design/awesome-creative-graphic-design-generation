name: Paper PDF Build Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'paper/main-fast.tex'
      - 'paper/scripts/build_pdf_fast.sh'
      - 'paper/Makefile'
      - 'paper/main.tex'
      - '.github/workflows/paper-build-benchmark.yml'

permissions:
  contents: read

concurrency:
  group: paper-build-benchmark-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compare:
    name: Compare normal and no-index PDF builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout manuscript
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache original logo masters
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            paper/figs/assets/logos/bit-original.ai
            paper/figs/assets/logos/salesforce-official.zip
            paper/figs/assets/logos/meituan-official.zip
          key: institution-master-assets-v1-bit6fcb6505-salesforceb8cca7fa-meituan6817f88d
      - name: Time fresh LaTeX/BibTeX builds
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main-fast.tex
          working_directory: paper
          extra_system_packages: 'rsvg-convert curl python3 unzip time bash poppler-utils'
          pre_compile: |
            sh scripts/build_figures.sh
            mkdir -p build-timings
            bash scripts/build_pdf_fast.sh > build-timings/fast-bootstrap.log 2>&1
            /usr/bin/time -f 'elapsed_seconds=%e max_rss_kb=%M' -o build-timings/fast-warm.time \
              bash scripts/build_pdf_fast.sh > build-timings/fast-warm.log 2>&1
            cat build-timings/fast-warm.time
            # Compare with the canonical build, retaining the draft build logs.
            /usr/bin/time -f 'elapsed_seconds=%e max_rss_kb=%M' -o build-timings/main.time \
              latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode main.tex \
              > build-timings/main.build.log 2>&1
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Publish timing results
        if: always()
        shell: bash
        run: |
          if [[ -f paper/build-timings/main.time ]]; then
            echo '### Normal build' >> "$GITHUB_STEP_SUMMARY"
            cat paper/build-timings/main.time >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f paper/build-timings/fast-warm.time ]]; then
            echo '### Fast incremental draft' >> "$GITHUB_STEP_SUMMARY"
            cat paper/build-timings/fast-warm.time >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload logs and benchmark PDFs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-pdf-build-benchmark
          retention-days: 7
          if-no-files-found: warn
          path: |
            paper/build-timings/*
            paper/main.pdf
            paper/main-fast.pdf
