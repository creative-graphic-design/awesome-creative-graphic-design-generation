name: Update LayerDiffuse metadata
on:
  push:
    branches: [metadata/layerdiffuse-tog-2024]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: metadata/layerdiffuse-tog-2024
      - uses: astral-sh/setup-uv@v6
      - name: Update metadata and regenerate README
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data/resources.csv')
          s = p.read_text()
          old = 'Papers,Composable and Layered Asset Generation,LayerDiffuse,https://arxiv.org/abs/2402.17113,Adds latent transparency to pretrained diffusion models for single- and multi-layer transparent image generation.,Diffusion,arXiv,2024,2024-02-27,,arXiv v1'
          new = 'Papers,Composable and Layered Asset Generation,LayerDiffuse,https://doi.org/10.1145/3658150,Adds latent transparency to pretrained diffusion models for single- and multi-layer transparent image generation (ACM TOG 2024).,Diffusion,ACM TOG,2024,2024-02-27,,arXiv v1 precedes ACM TOG 43(4) publication in July 2024; exact first-online day not established'
          if old not in s:
              raise SystemExit('target row not found')
          p.write_text(s.replace(old, new))
          PY
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/resources.csv README.md
          git commit -m 'Record LayerDiffuse as an ACM TOG 2024 paper'
          git push
