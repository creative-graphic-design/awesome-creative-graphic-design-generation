name: Audit scientific poster pipeline metadata
on:
  push:
    branches: [metadata/scientific-poster-pipelines]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Add audited metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import io

          p = Path('data/paper_metadata.csv')
          raw = p.read_bytes()
          names = {row['name'] for row in csv.DictReader(io.StringIO(raw.decode('utf-8')))}
          rows = [
              [
                  'Paper2Poster',
                  'https://paper2poster.github.io/',
                  'https://github.com/Paper2Poster/Paper2Poster',
                  '',
                  'pipeline',
                  'not-applicable',
                  'Top-down visual-in-the-loop multi-agent scientific poster generation',
                  'Configurable GPT-4o or Qwen-2.5 LLM/VLM backends; PPTX rendering',
                  'None',
                  'Paper2Poster dataset; PaperQuiz; VLM-as-Judge',
                  'Editable PPTX',
                  'Official repository releases the end-to-end PosterAgent pipeline, Docker/Gradio support, evaluation code, dataset, and local/API model configurations. It does not require a task-specific trained checkpoint.',
                  '2026-10-07',
              ],
              [
                  'P2P',
                  '',
                  'https://github.com/multimodal-art-projection/P2P',
                  '',
                  'pipeline',
                  'not-applicable',
                  'LLM multi-agent paper-to-poster generation and fine-grained evaluation',
                  'Configurable API language models such as GPT-4o-mini or Claude',
                  'P2PInstruct',
                  'P2PEval',
                  'Poster JSON; HTML; PNG',
                  'Official repository releases runnable generation/evaluation code, a Hugging Face Space, and the P2PInstruct/P2PEval datasets. The generation system is an API-model pipeline rather than a task-specific released checkpoint.',
                  '2026-10-07',
              ],
              [
                  'Any2Poster',
                  'https://any2poster.github.io/',
                  'https://github.com/Any2Poster/Any2Poster',
                  '',
                  'pipeline',
                  'not-applicable',
                  'Any-source checkpointed agentic poster generation',
                  'Configurable OpenRouter LLM/VLM models; Gemini 3 Pro visual synthesis; Playwright rendering',
                  'None',
                  'Any2Poster Bench; BenchQuiz; VLM-as-Judge',
                  'HTML artifact; PDF; PNG',
                  'Official repository released code, benchmark, and evaluation pipeline on 2026-05-27. The six-stage system composes configurable foundation models and deterministic HTML/CSS rendering rather than releasing a task-specific checkpoint.',
                  '2026-10-07',
              ],
          ]
          line_ending = '\r\n' if b'\r\n' in raw else '\n'
          out = io.StringIO(newline='')
          writer = csv.writer(out, lineterminator=line_ending)
          added = 0
          for row in rows:
              if row[0] not in names:
                  writer.writerow(row)
                  added += 1
          assert added == 3, f'expected 3 new metadata rows, got {added}'
          prefix = b'' if raw.endswith((b'\n', b'\r')) else line_ending.encode()
          p.write_bytes(raw + prefix + out.getvalue().encode('utf-8'))
          PY
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/paper_metadata.csv README.md
          git commit -m 'Audit scientific poster pipeline metadata'
          git push
