name: Add verified layout coverage gaps
on:
  push:
    branches: [coverage/layout-awesome-list-delta]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Add verified layout papers
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          p = Path('data/resources.csv')
          s = p.read_text()
          existing = {row['name'] for row in csv.DictReader(s.splitlines())}
          anchor = 'Papers,Content-Aware Layout Generation,Design Element Aware Poster Layout Generation,https://doi.org/10.1145/3627673.3679557,Models poster design elements and their relationships for content-aware poster layout generation (CIKM 2024).,Autoregressive / Transformer,CIKM,2024,,2024-10-21,CIKM 2024 conference start; no arXiv located\n'
          rows = ''
          if 'Automatic Layout Planning for Visually-Rich Documents with Instruction-Following Models' not in existing:
              rows += 'Papers,Content-Aware Layout Generation,Automatic Layout Planning for Visually-Rich Documents with Instruction-Following Models,https://aclanthology.org/2024.alvr-1.14/,"Introduces DocLap, a VLM-based instruction-following framework that arranges visual design components on blank canvases or predefined poster backgrounds (ALVR 2024).",VLM,ACL Workshop (ALVR),2024,2024-04-23,2024-08-16,arXiv v1 precedes ALVR 2024 workshop date\n'
          if 'DensityLayout' not in existing:
              rows += 'Papers,Content-Aware Layout Generation,DensityLayout,https://doi.org/10.1007/978-3-031-46308-2_16,"Generates visual-textual presentation layouts over given images with density-aware conditioning for automated poster design (ICIG 2023).",GAN,ICIG,2023,,2023-09-22,ICIG 2023 conference start; no arXiv located\n'
          assert anchor in s
          assert rows
          p.write_text(s.replace(anchor, anchor + rows))
          PY
          uv run python scripts/generate_readme.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/resources.csv README.md
          git commit -m 'Add verified layout coverage gaps'
          git push
