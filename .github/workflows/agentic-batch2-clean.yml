name: Clean agentic taxonomy batch 2
on:
  push:
    branches: [taxonomy/split-agentic-multistage-batch-2]
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: taxonomy/split-agentic-multistage-batch-2
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Restore exact CSV formatting and apply only intended replacements
        run: |
          git show origin/main:data/resources.csv > /tmp/resources.csv
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/resources.csv')
          text = p.read_text()
          reps = {
            'SmartText': ('Agentic / Multi-stage System', 'Multi-stage System'),
            'TextPainter': ('Agentic / Multi-stage System', 'Multi-stage System'),
            'CreaGAN': ('Agentic / Multi-stage System; GAN', 'Multi-stage System; GAN'),
            'Iris: a multi-constraint graphic layout generation system': ('Agentic / Multi-stage System; VAE', 'Multi-stage System; VAE'),
            'LayerD': ('Agentic / Multi-stage System', 'Multi-stage System'),
            'ReDesign': ('Agentic / Multi-stage System', 'Multi-stage System'),
            'Content-Aware Ad Banner Layout Generation with Two-Stage Chain-of-Thought in Vision Language Models': ('VLM; Agentic / Multi-stage System', 'VLM; Multi-stage System'),
            'COLE': ('Agentic / Multi-stage System; Diffusion; LLM; VLM', 'Multi-stage System; Diffusion; LLM; VLM'),
            'OpenCOLE': ('Agentic / Multi-stage System; Diffusion; LLM; VLM', 'Multi-stage System; Diffusion; LLM; VLM'),
            'T-Stars-Poster': ('Agentic / Multi-stage System; Diffusion; VLM', 'Multi-stage System; Diffusion; VLM'),
          }
          out=[]; seen=set()
          for line in text.splitlines(True):
              for name,(old,new) in reps.items():
                  if f',{name},' in line:
                      if old not in line:
                          raise SystemExit(f'old label missing for {name}')
                      line=line.replace(old,new,1); seen.add(name); break
              out.append(line)
          missing=set(reps)-seen
          if missing: raise SystemExit(f'missing rows: {sorted(missing)}')
          Path('data/resources.csv').write_text(''.join(out))
          PY
          uv run python scripts/generate_readme.py
          rm .github/workflows/agentic-batch2-clean.yml
      - name: Commit clean diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/resources.csv README.md .github/workflows/agentic-batch2-clean.yml
          git commit -m "Keep taxonomy batch diff formatting-only clean"
          git push
