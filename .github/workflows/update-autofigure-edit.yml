name: Update AutoFigure-Edit metadata
on:
  push:
    branches: [metadata/autofigure-edit-acl-2026]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: metadata/autofigure-edit-acl-2026
      - uses: astral-sh/setup-uv@v6
      - name: Update metadata and regenerate README
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data/resources.csv')
          s = p.read_text()
          old = 'Papers,Scientific Figure and Graphical Abstract Generation,AutoFigure-Edit,https://arxiv.org/abs/2603.06674,Generates fully editable SVG scientific illustrations from long-form scientific text with reference-guided styling and interactive refinement.,Multi-stage System; VLM,arXiv,2026,2026-03-03,,arXiv v1'
          new = 'Papers,Scientific Figure and Graphical Abstract Generation,AutoFigure-Edit,https://aclanthology.org/2026.acl-demo.6/,Generates fully editable SVG scientific illustrations from long-form scientific text with reference-guided styling and interactive refinement (ACL System Demonstrations 2026).,Multi-stage System; VLM,ACL System Demonstrations,2026,2026-03-03,2026-07-02,arXiv v1 precedes ACL 2026 conference start'
          if old not in s:
              raise SystemExit('target row not found')
          p.write_text(s.replace(old, new))
          PY
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/resources.csv README.md
          git commit -m 'Record AutoFigure-Edit as an ACL 2026 demo paper'
          git push
