name: Audit arXiv metadata

on:
  push:
    branches: [audit/venue-metadata-scan]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inspect arXiv metadata
        run: |
          python - <<'PY'
          import csv, re, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path

          rows = list(csv.DictReader(Path('data/resources.csv').open(encoding='utf-8', newline='')))
          by_id = {}
          for row in rows:
              if row['section'] != 'Papers':
                  continue
              m = re.match(r'https?://arxiv\.org/abs/([^?#]+)', row['url'])
              if m:
                  by_id[m.group(1)] = row

          ns = {'a':'http://www.w3.org/2005/Atom', 'x':'http://arxiv.org/schemas/atom'}
          ids = list(by_id)
          print('ARXIV_AUDIT_BEGIN')
          for i in range(0, len(ids), 25):
              chunk = ids[i:i+25]
              q = urllib.parse.urlencode({'id_list': ','.join(chunk), 'max_results': len(chunk)})
              req = urllib.request.Request('https://export.arxiv.org/api/query?' + q, headers={'User-Agent':'awesome-creative-graphic-design-generation/1.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  root = ET.parse(r).getroot()
              for e in root.findall('a:entry', ns):
                  aid = e.findtext('a:id', '', ns).rsplit('/',1)[-1].split('v')[0]
                  row = by_id.get(aid)
                  if not row:
                      continue
                  title = ' '.join(e.findtext('a:title','',ns).split())
                  published = e.findtext('a:published','',ns)[:10]
                  comment = e.findtext('x:comment','',ns) or ''
                  journal = e.findtext('x:journal_ref','',ns) or ''
                  print('\t'.join(['ARXIV', aid, row['name'], row['venue'], row['venue_year'], published, journal.replace('\t',' '), comment.replace('\t',' ').replace('\n',' '), title]))
          print('ARXIV_AUDIT_END')
          PY
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-arxiv-metadata.yml
          git commit -m 'Remove temporary arXiv audit workflow'
          git push
