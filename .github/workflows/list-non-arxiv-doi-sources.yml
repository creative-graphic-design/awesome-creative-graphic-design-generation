name: List non-arXiv DOI sources

on:
  push:
    branches: [audit/non-arxiv-doi-sources]

permissions:
  contents: write

jobs:
  list:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: List remaining source types
        run: |
          python - <<'PY'
          import csv, urllib.parse, collections
          rows = list(csv.DictReader(open('data/resources.csv', encoding='utf-8', newline='')))
          groups = collections.defaultdict(list)
          for r in rows:
              if r['section'] != 'Papers':
                  continue
              if r['url'].startswith('https://arxiv.org/') or r['url'].startswith('https://doi.org/'):
                  continue
              host = urllib.parse.urlparse(r['url']).netloc
              groups[host].append(r)
          print('OTHER_SOURCES_BEGIN')
          total = 0
          for host in sorted(groups):
              print(f'HOST\t{host}\t{len(groups[host])}')
              for r in groups[host]:
                  print('\t'.join(['ROW', r['name'], r['venue'], r['venue_year'], r['venue_date'], r['url']]))
                  total += 1
          print(f'TOTAL\t{total}')
          print('OTHER_SOURCES_END')
          PY
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/list-non-arxiv-doi-sources.yml
          git commit -m 'Remove temporary source-list workflow'
          git push
