name: Audit DLT LACE Layout-Corrector

on:
  push:
    branches:
      - metadata/dlt-lace-layout-corrector
    paths:
      - .github/workflows/audit-dlt-lace-layout-corrector.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: metadata/dlt-lace-layout-corrector
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Add audited metadata
        run: |
          git fetch origin main
          git show origin/main:data/paper_metadata.csv > data/paper_metadata.csv
          cat >> data/paper_metadata.csv <<'EOF'
          DLT,https://wix-incubator.github.io/DLT/,https://github.com/wix-incubator/DLT,,train+inference,unknown,Joint discrete-continuous diffusion layout transformer,Transformer diffusion model over categorical and geometric layout variables,"RICO; PubLayNet; Magazine","RICO; PubLayNet; Magazine",Structured layout samples,"Official repository provides training, conditional generation, sample generation, and metric evaluation. No canonical public pretrained-checkpoint download was verified in the repository documentation.",2026-10-07
          LACE,,https://github.com/puar-playground/LACE,https://huggingface.co/datasets/puar-playground/LACE/tree/main,train+inference,released,Diffusion layout generation with aesthetic constraints,Transformer diffusion denoiser,"PubLayNet; RICO; Magazine","PubLayNet; RICO; Magazine",Structured layout boxes,"Official repository provides training and testing code plus downloadable trained diffusion-model and FID checkpoints and prepared datasets on Hugging Face.",2026-10-07
          Layout-Corrector,https://iwa-shi.github.io/Layout-Corrector-Project-Page/,https://github.com/line/Layout-Corrector,https://drive.google.com/file/d/1og3l0enR67rDwiAN44K4RchcFYAgsbNq/view,train+inference,released,Learned token-level layout corrector for discrete diffusion generators,"Layout-Corrector classifier with LayoutDM, VQDiffusion, or MaskGIT generators","PubLayNet; RICO; Crello","PubLayNet; RICO; Crello",Structured corrected layout boxes,"Official repository provides corrector and baseline training, testing, demo notebooks, metrics, and a starter kit containing datasets and pretrained models.",2026-10-07
          EOF
          uv run python scripts/generate_readme.py
          git rm .github/workflows/audit-dlt-lace-layout-corrector.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/paper_metadata.csv README.md
          git commit -m 'Audit DLT LACE and Layout-Corrector reproducibility metadata'
          git push origin HEAD:metadata/dlt-lace-layout-corrector
