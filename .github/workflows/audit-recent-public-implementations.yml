name: Audit recent public implementations
on:
  push:
    branches: [metadata/recent-public-implementations]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Add audited metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import io

          p = Path('data/paper_metadata.csv')
          raw = p.read_bytes()
          text = raw.decode('utf-8')
          names = {row['name'] for row in csv.DictReader(io.StringIO(text))}

          rows = [
              [
                  'Mirror in the Model: Ad Banner Image Generation via Reflective Multi-LLM and Multi-modal Agents',
                  '',
                  'https://github.com/sony/mimo',
                  '',
                  'pipeline',
                  'not-applicable',
                  'Reflective multi-agent multimodal ad-banner generation',
                  'Configurable Gemini or GPT multimodal/image-generation API models',
                  'None',
                  '',
                  'Raster advertising banner image',
                  'Official Sony repository provides a minimal runnable multi-agent artifact; it composes external API models and does not release a task-specific trained checkpoint.',
                  '2026-10-07',
              ],
              [
                  'UTDesign',
                  'https://utdesign-official.github.io/home/',
                  'https://github.com/ZYM-PKU/UTDesign',
                  'https://huggingface.co/UTDesign/UTDesign_v1.0',
                  'train+inference',
                  'released',
                  'Unified diffusion framework for stylized-text editing and generation',
                  'Diffusers; FLUX VAE; DINOv2 visual conditioning; CLIP style encoder; multimodal layout planner',
                  'Gray-scale and colored font data; annotated design-image data including Kingsoft-provided data',
                  '',
                  'RGBA foreground glyphs; raster graphic-design images',
                  'Official repository provides inference pipelines, a Gradio demo, multi-stage training instructions, and released Hugging Face checkpoints.',
                  '2026-10-07',
              ],
              [
                  'SlideTailor',
                  '',
                  'https://github.com/nusnlp/SlideTailor',
                  '',
                  'pipeline',
                  'not-applicable',
                  'Personalized agentic scientific slide generation',
                  'GPT-4o-2024-08-06; PPTAgent-derived slide rendering pipeline',
                  'None',
                  'SlideTailor-PSP dataset',
                  'Editable PPTX',
                  'Official repository releases the runnable generation/evaluation pipeline and PSP dataset; the system uses API-based agents rather than a task-specific released checkpoint.',
                  '2026-10-07',
              ],
          ]

          line_ending = '\r\n' if b'\r\n' in raw else '\n'
          out = io.StringIO(newline='')
          writer = csv.writer(out, lineterminator=line_ending)
          added = 0
          for row in rows:
              if row[0] not in names:
                  writer.writerow(row)
                  added += 1
          assert added == 3, f'expected 3 new metadata rows, got {added}'

          prefix = b'' if raw.endswith((b'\n', b'\r')) else line_ending.encode()
          p.write_bytes(raw + prefix + out.getvalue().encode('utf-8'))
          PY
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/paper_metadata.csv README.md
          git commit -m 'Audit recent public implementation metadata'
          git push
