name: Update DeepSlides ACL metadata

on:
  push:
    branches:
      - metadata/deepslides-acl-findings-2026

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: metadata/deepslides-acl-findings-2026
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Update metadata and regenerate README
        run: |
          python - <<'PY'
          from pathlib import Path

          resources = Path('data/resources.csv')
          text = resources.read_text()
          old = 'Papers,Scientific Poster and Slide Generation,Design First Code Later,https://arxiv.org/abs/2605.26451,"Introduces DeepSlides, a template-free design-first slide-generation workflow with SlideDesign data and reinforcement-learned SlideQwen models.",LLM,arXiv,2026,2026-04-08,,arXiv v1'
          new = 'Papers,Scientific Poster and Slide Generation,"Design First, Code Later: Aesthetically Pleasing Template-Free Slides Generation",https://aclanthology.org/2026.findings-acl.1524/,"Introduces DeepSlides, a template-free design-first slide-generation workflow with SlideDesign data and reinforcement-learned SlideQwen models (ACL Findings 2026).",LLM,ACL Findings,2026,2026-04-08,2026-07-02,arXiv v1 precedes ACL 2026 conference start'
          if text.count(old) != 1:
              raise SystemExit(f'expected one DeepSlides resource row, found {text.count(old)}')
          resources.write_text(text.replace(old, new))

          metadata = Path('data/paper_metadata.csv')
          mtext = metadata.read_text()
          old_name = 'Design First Code Later,'
          new_name = '"Design First, Code Later: Aesthetically Pleasing Template-Free Slides Generation",'
          if mtext.count(old_name) != 1:
              raise SystemExit(f'expected one DeepSlides metadata row, found {mtext.count(old_name)}')
          metadata.write_text(mtext.replace(old_name, new_name, 1))
          PY
          uv run python scripts/generate_readme.py
          git rm .github/workflows/update-deepslides-acl.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resources.csv data/paper_metadata.csv README.md
          git commit -m 'Record DeepSlides as an ACL Findings 2026 paper'
          git push
