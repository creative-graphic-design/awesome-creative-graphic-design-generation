name: Awesome Lint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check generated README
        run: python3 scripts/generate_readme.py --check
      - name: Run awesome-lint
        run: npx awesome-lint
