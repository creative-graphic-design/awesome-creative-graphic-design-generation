name: Awesome Lint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync generator environment
        run: uv sync

      - name: Consolidate structured catalogs
        run: uv run python scripts/consolidate_catalog.py

      - name: Regenerate README
        run: uv run python scripts/generate_readme.py

      - name: Commit generated catalog migration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate structured catalog data"
          git push origin HEAD:${{ github.head_ref }}

      - name: Run awesome-lint
        run: npx awesome-lint
