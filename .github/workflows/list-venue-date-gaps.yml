name: List venue date gaps

on:
  push:
    branches: [audit/venue-date-gaps]

permissions:
  contents: write

jobs:
  list:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Print missing paper venue dates
        run: |
          python - <<'PY'
          import csv, collections
          rows = list(csv.DictReader(open('data/resources.csv', encoding='utf-8', newline='')))
          groups = collections.defaultdict(list)
          for r in rows:
              if r['section'] == 'Papers' and r['venue'] and r['venue'] != 'arXiv' and not r['venue_date']:
                  groups[(r['venue'], r['venue_year'])].append(r['name'])
          print('VENUE_DATE_GAPS_BEGIN')
          for key in sorted(groups, key=lambda x: (x[1], x[0])):
              print(f'{key[0]}\t{key[1]}\t{len(groups[key])}\t' + ' || '.join(groups[key]))
          print('VENUE_DATE_GAPS_END')
          PY
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/list-venue-date-gaps.yml
          git commit -m 'Remove temporary venue-gap workflow'
          git push
