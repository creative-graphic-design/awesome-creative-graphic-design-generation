name: Clean DeepSlides metadata diff

on:
  push:
    branches:
      - metadata/deepslides-acl-findings-2026

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: metadata/deepslides-acl-findings-2026
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Restore metadata file and keep stable alias key
        run: |
          git checkout origin/main -- data/paper_metadata.csv
          python - <<'PY'
          from pathlib import Path
          path = Path('data/resources.csv')
          text = path.read_text()
          old = 'Papers,Scientific Poster and Slide Generation,"Design First, Code Later: Aesthetically Pleasing Template-Free Slides Generation",https://aclanthology.org/2026.findings-acl.1524/,"Introduces DeepSlides, a template-free design-first slide-generation workflow with SlideDesign data and reinforcement-learned SlideQwen models (ACL Findings 2026).",LLM,ACL Findings,2026,2026-04-08,2026-07-02,arXiv v1 precedes ACL 2026 conference start'
          new = 'Papers,Scientific Poster and Slide Generation,Design First Code Later,https://aclanthology.org/2026.findings-acl.1524/,"Introduces DeepSlides, a template-free design-first slide-generation workflow with SlideDesign data and reinforcement-learned SlideQwen models (ACL Findings 2026).",LLM,ACL Findings,2026,2026-04-08,2026-07-02,arXiv v1 precedes ACL 2026 conference start'
          if text.count(old) != 1:
              raise SystemExit(f'expected one canonical-title DeepSlides row, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          uv run python scripts/generate_readme.py
          git rm .github/workflows/clean-deepslides-diff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resources.csv data/paper_metadata.csv README.md
          git commit -m 'Keep DeepSlides metadata key stable'
          git push
