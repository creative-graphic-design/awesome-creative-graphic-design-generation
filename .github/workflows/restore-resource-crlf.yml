name: Restore resources CSV line endings

on:
  push:
    branches:
      - data/normalize-venue-dates

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: data/normalize-venue-dates
      - uses: astral-sh/setup-uv@v6
      - name: Restore canonical CRLF without changing CSV content
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("data/resources.csv")
          text = path.read_text(encoding="utf-8")
          normalized = text.replace("\r\n", "\n").replace("\r", "\n")
          path.write_bytes(normalized.replace("\n", "\r\n").encode("utf-8"))
          PY
          uv sync
          uv run python scripts/generate_readme.py --check
      - name: Remove one-off helper and commit result
        run: |
          rm .github/workflows/restore-resource-crlf.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/resources.csv .github/workflows/restore-resource-crlf.yml
          git commit -m "Restore resources CSV line endings"
          git push origin HEAD:data/normalize-venue-dates
