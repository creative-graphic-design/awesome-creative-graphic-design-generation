name: Regenerate README (temporary)

on:
  push:
    branches:
      - add-oct-2026-design-papers

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: add-oct-2026-design-papers

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync generator environment
        run: uv sync

      - name: Fix PlayGround CSV quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("data/resources.csv")
          text = path.read_text()
          old = 'Papers,Content-Aware Layout Generation,PlayGround,https://arxiv.org/abs/2610.18865,,Generates editable layouts progressively by conditioning a VLM planner on the current rendered canvas, retrieving structural references, predicting group-level geometry, and verifying rendered candidates.,Autoregressive; VLM; Multi-stage System,arXiv,2026,2026-10-13,,arXiv v1'
          new = 'Papers,Content-Aware Layout Generation,PlayGround,https://arxiv.org/abs/2610.18865,,"Generates editable layouts progressively by conditioning a VLM planner on the current rendered canvas, retrieving structural references, predicting group-level geometry, and verifying rendered candidates.",Autoregressive; VLM; Multi-stage System,arXiv,2026,2026-10-13,,arXiv v1'
          if old not in text:
              raise SystemExit("expected PlayGround row not found")
          path.write_text(text.replace(old, new))
          PY

      - name: Validate canonical resource contract
        run: uv run python scripts/validate_resource_contract.py

      - name: Generate README
        run: uv run python scripts/generate_readme.py

      - name: Commit corrected data and generated README
        shell: bash
        run: |
          if git diff --quiet -- data/resources.csv README.md; then
            echo "Data and README are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resources.csv README.md
          git commit -m "Regenerate README"
          git push origin HEAD:add-oct-2026-design-papers
