name: Regenerate README (temporary)

on:
  push:
    branches:
      - add-oct-2026-design-papers

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: add-oct-2026-design-papers

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync generator environment
        run: uv sync

      - name: Generate README
        run: uv run python scripts/generate_readme.py

      - name: Commit generated README
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Regenerate README"
          git push origin HEAD:add-oct-2026-design-papers
