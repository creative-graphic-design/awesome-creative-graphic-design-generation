name: Catalog Refresh Once

on:
  push:
    branches:
      - bootstrap-awesome-list

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: bootstrap-awesome-list
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Refresh catalog data
        run: python scripts/catalog_refresh_once.py

      - name: Sync generator environment
        run: uv sync

      - name: Regenerate README
        run: uv run python scripts/generate_readme.py

      - name: Commit refreshed catalog
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resources.csv data/paper_metadata.csv README.md
          git commit -m "Expand poster and advertising research coverage"
          git push origin HEAD:bootstrap-awesome-list
