name: Catalog Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  catalog-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync generator environment
        run: uv sync

      - name: Audit method coverage and regenerate README
        run: |
          uv run python scripts/fix_layoutgan_alias.py
          uv run python scripts/migrate_architecture_coverage.py
          uv run python scripts/generate_readme.py

      - name: Commit audited catalog
        run: |
          if git diff --quiet -- data/resources.csv data/paper_methods.csv data/paper_metadata.csv README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resources.csv data/paper_methods.csv data/paper_metadata.csv README.md
          git commit -m "Complete architecture audit and expand coverage"
          git push origin HEAD:${{ github.head_ref }}
