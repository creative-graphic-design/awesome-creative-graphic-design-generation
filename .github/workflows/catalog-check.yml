name: Catalog Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  catalog-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync generator environment
        run: uv sync

      - name: Report unclassified paper methods
        run: |
          python - <<'PY'
          import csv
          resources = list(csv.DictReader(open('data/resources.csv', encoding='utf-8')))
          methods = list(csv.DictReader(open('data/paper_methods.csv', encoding='utf-8')))
          classified = {row['name'] for row in methods}
          missing = [row for row in resources if row['section'] == 'Papers' and row['name'] not in classified]
          print(f'UNCLASSIFIED_COUNT={len(missing)}')
          for row in missing:
              print(f"UNCLASSIFIED\t{row['category']}\t{row['name']}\t{row['url']}")
          PY

      - name: Check generated README
        run: uv run python scripts/generate_readme.py --check
